<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>verse rendering — diagnostic</title>
<style>
  body { font-family: Georgia, serif; max-width: 860px; margin: 60px auto; padding: 0 20px; background: #faf8f3; color: #1c1813; }
  h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #736b5c; }
  h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #736b5c; margin: 40px 0 4px; }
  /* synced with the app: static, set in stone, sized to length */
  .verse { font-size: clamp(30px, 5vw, 56px); line-height: 1.3; white-space: pre-line; margin: 10px 0; text-wrap: pretty; }
  .verse.size-m { font-size: clamp(26px, 4vw, 44px); }
  .verse.size-l { font-size: clamp(22px, 3.2vw, 36px); line-height: 1.4; }
  .verse.size-xl { font-size: clamp(17px, 2.3vw, 27px); line-height: 1.5; }
  #status { font-family: ui-monospace, monospace; font-size: 13px; color: #736b5c; margin-top: 30px; white-space: pre-line; }
</style>
</head>
<body>
<h1>Verse rendering — static, set in stone, sized to length</h1>
<div id="root"></div>
<div id="status">loading…</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../canon-parser.js"></script>
<script type="text/babel" src="../components.jsx"></script>
<script type="text/babel">
/* Renders the real RenewedText at each size tier using real canon entries. */
const SAMPLE = [
  "== Delphi @Reason ==",
  "",
  "the Temple of Apollo",
  "Know [thyself→yourself].",
  "",
  "== Exodus @Revelation ==",
  "",
  "* 3:14",
  "And [God→We] said unto [Moses→ourselves], [I AM→WE ARE] THAT [I AM→WE ARE]: and [he→we] said, [Thus shalt thou say unto the children of Israel→unto all our children], [I AM hath sent me unto you→WE ARE HERE].",
  "",
  "== Hobbes @Law ==",
  "",
  "* De Cive",
  "To speak [impartially→steadfastly], both sayings are very true; That [Man→Human] to [Man→Human] is a kind of God; and that [Man→Human] to [Man→Human] is [an arrant Wolfe→a tender Shepherd].",
  "",
  "== Hobbes @Enlightenment ==",
  "",
  "* Leviathan, XIII",
  "In such condition, there is [no→always a] place for [Industry→rest]; because the fruit thereof is [uncertain→certain]: and consequently [no→every] Culture of [the Earth→Earth]; [no→every] Navigation, [nor→or] use of the commodities that may be imported by Sea; [no→every] commodious Building; [no→all] Instruments of moving, and removing such things as require much force; [no→all] Knowledge of the face of [the Earth→Earth]; [no→every] account of Time; [no→all] Arts; [no→all] Letters; [no→every] Society; and which is [worst→best] of all, continuall [feare→love], and [danger of violent death→sureness of peaceful life]; And the [life→lives] of [man→humanity], [solitary→communal], [poore→well], [nasty→beautiful], [brutish→dignified], and [short→long].",
  "",
].join("\n");

const recs = parseCanonText(SAMPLE).map(normalizeRecord);
const labels = ["base (short)", "size-m (medium)", "size-l (long)", "size-xl (wall)"];

function Demo() {
  React.useEffect(() => {
    document.getElementById("status").textContent =
      "RenewedText loaded: " + (typeof RenewedText === "function") +
      "\nstatic render — no animation, no marking; each verse sized to its length";
  });
  return (
    <>
      {recs.map((r, i) => (
        <React.Fragment key={i}>
          <h2>{labels[i]} — {r.display || r.reference}</h2>
          <RenewedText passage={r} />
        </React.Fragment>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
