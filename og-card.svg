<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Ultimate Bible — social card. Bone paper, Prata wordmark, gold claim.
       Render: rsvg-convert -w 1200 -h 630 og-card.svg -o og.png -->
  <rect width="1200" height="630" fill="#faf8f3"/>
  <rect x="14" y="14" width="1172" height="602" fill="none" stroke="#e6ddcb" stroke-width="1.5"/>

  <!-- the mark: the Ultimatum rose window above the wordmark -->
  <image href="Ultimatum.png" x="561" y="130" width="78" height="78"/>

  <text x="600" y="382" text-anchor="middle"
        font-family="Prata" font-size="118" fill="#1c1813">Ultimate Bible</text>

  <text x="608" y="464" text-anchor="middle"
        font-family="Prata" font-size="25" letter-spacing="9"
        fill="#8a6c33">THE LASTING WORD</text>
</svg>
